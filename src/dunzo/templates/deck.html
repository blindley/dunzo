{% extends "base.html" %}
{% block title %}{{ deck.name }} · dunzo{% endblock %}
{% block content %}
<p><a href="/decks">&larr; Decks</a></p>
<h1>{{ deck.name }}</h1>
<p>
  <a class="button" href="/decks/{{ deck.id }}/notes/new">Add note</a>
  {% if counts.due or counts.new %}
  <a class="button" href="/decks/{{ deck.id }}/review">Review ({{ counts.due }} due, {{ counts.new }} new)</a>
  {% endif %}
  <a class="button" href="/decks/{{ deck.id }}/stats">Stats</a>
  <a class="button" href="/decks/{{ deck.id }}/export">Export</a>
</p>
<div id="note-list">
  {% include "_note_list.html" %}
</div>
{% endblock %}
