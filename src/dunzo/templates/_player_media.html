{% if media_list %}
<ul class="deck-list">
  {% for m in media_list %}
  <li class="deck-row">
    <a class="deck-name" href="/media/{{ m.id }}" target="_blank" rel="noopener">{{ m.mime }}</a>
    <code class="deck-meta" title="{{ m.id }}">{{ m.id[:12] }}</code>
    <span class="deck-meta">{{ m.size | filesize }}</span>
    <button type="button" class="danger"
            hx-delete="/players/{{ player_id }}/media/{{ m.id }}" hx-target="#player-media" hx-swap="innerHTML"
            hx-confirm="Remove this file from the player?">
      Remove
    </button>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="empty">No media attached.</p>
{% endif %}
